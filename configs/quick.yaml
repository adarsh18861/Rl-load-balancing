# Fast sanity run: 2 seeds, short training, meant to finish in well under 5 minutes.
env:
  n_servers: 5
  mu: [0.9, 0.7, 0.5, 0.4, 0.3]
  q_max: 4
  overload_penalty: 5.0

traffic:
  steady: {lam: 0.8}
  bursty: {lam_low: 0.3, lam_high: 0.95, p_low_to_high: 0.05, p_high_to_low: 0.1}
  cyclical: {lam_min: 0.3, lam_max: 0.95, period: 200}

observation:
  full: {kind: full}
  noise_high: {kind: noise, p_noise: 0.3}
  delay_5: {kind: delay, k: 5}

qlearning:
  alpha_grid: [0.1]
  gamma_grid: [0.95]
  epsilon_start: 1.0
  epsilon_end: 0.05
  train_steps: 4000
  eval_steps: 2000
  tuning_seeds: [9001]

max_states: 50000
time_bound: 5
seeds: [0, 1]

configs: [C1, C2, C3, C4, C5, C6, C8, C11, C12, C13]
