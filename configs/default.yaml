env:
  n_servers: 5
  mu: [0.9, 0.7, 0.5, 0.4, 0.3]
  q_max: 4
  overload_penalty: 5.0

traffic:
  steady: {lam: 0.8}
  bursty: {lam_low: 0.3, lam_high: 0.95, p_low_to_high: 0.05, p_high_to_low: 0.1}
  cyclical: {lam_min: 0.3, lam_max: 0.95, period: 200}

observation:
  full: {kind: full}
  noise_low: {kind: noise, p_noise: 0.1}
  noise_high: {kind: noise, p_noise: 0.3}
  delay_2: {kind: delay, k: 2}
  delay_5: {kind: delay, k: 5}
  delay_10: {kind: delay, k: 10}
  noise_delay: {kind: noise_delay, k: 5, p_noise: 0.15}

qlearning:
  alpha_grid: [0.05, 0.1, 0.2]
  gamma_grid: [0.9, 0.95]
  epsilon_start: 1.0
  epsilon_end: 0.05
  train_steps: 80000
  eval_steps: 20000
  tuning_seeds: [9001, 9002]

max_states: 50000
time_bound: 5
seeds: [0, 1, 2, 3, 4]

configs: [C1, C2, C3, C4, C5, C6, C8, C11, C12, C13]
